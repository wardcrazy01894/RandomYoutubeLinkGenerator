# Gitleaks config.
#
# The pool is tens of thousands of random 11-character base64url video IDs, which is
# exactly the shape gitleaks' entropy and generic-api-key rules fire on. Without this
# allowlist every PR goes red on false positives and the signal is lost.
[extend]
useDefault = true

[[rules]]
id = "youtube-api-key"
description = "Google/YouTube Data API key committed to the repo"
regex = '''AIza[0-9A-Za-z_\-]{35}'''
keywords = ["AIza"]

# Only the files that are actually lists of video ids. manifest.json and state.json are
# script-written too, but hold no ids — allowlisting them meant a key leaked into either
# by a bug would never be flagged.
[allowlist]
description = "Generated pool id lists and lockfile"
paths = [
  '''public/data/pool/shard-\d+\.json''',
  '''public/data/pool/(tombstones|blocklist)\.json''',
  '''package-lock\.json''',
]
