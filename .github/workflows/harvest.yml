name: harvest

# Nightly sampling run. Pushes the grown pool to the unprotected `pool` branch, then
# publishes. It does NOT open a pull request: a GITHUB_TOKEN-created PR does not fire
# `pull_request` events, so the required checks on `main` would never report and every
# nightly PR would be permanently unmergeable. See docs/DESIGN.md §4.3.
#
# The nightly push to `pool` also counts as repo activity, which keeps GitHub from
# auto-disabling this schedule after 60 days.

on:
  schedule:
    - cron: '17 8 * * *' # 08:17 UTC — off the hour, since cron is best-effort anyway
  workflow_dispatch:
    inputs:
      units:
        description: 'Quota units to spend on harvesting (sweep uses ~500 more)'
        required: false
        default: '9000'
      baseline_reset:
        description: 'Relearn the yield baseline from this run (accepts a permanently changed yield)'
        type: boolean
        required: false
        default: false

# A called reusable workflow cannot request permissions the CALLER does not hold, and
# GitHub rejects the whole workflow at startup if it tries. The `publish` job calls
# deploy-pages.yml, which needs pages/id-token — so those must be granted here too,
# even though no step in this workflow uses them directly.
permissions:
  contents: write # push to the `pool` branch
  issues: write # raise the health alarm
  pages: write # required by the reusable deploy-pages.yml
  id-token: write # required by the reusable deploy-pages.yml

# Never let a manual run collide with the cron and fight over the branch.
concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      status: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Clone the branch WITH its .git so tonight's commit can be a CHILD of the
      # existing history. The previous version exported a bare snapshot and later
      # force-pushed an orphan commit, which left the pool branch permanently one
      # commit deep: no diffs between runs and no way to roll back a bad harvest.
      - name: Restore the live pool from the `pool` branch
        run: |
          set -euo pipefail
          # Distinguish "branch does not exist" (exit 2) from a transport/auth failure
          # (exit 128). Swallowing both meant a transient error silently took the
          # create-the-branch path and burned the night's quota on a rejected push.
          set +e
          git ls-remote --exit-code --heads origin pool >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            git clone --quiet --branch pool --single-branch --depth=1 \
              "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
              .pool-branch
            rm -rf public/data/pool && mkdir -p public/data/pool
            # archive rather than `cp -R .pool-branch/.`: that would copy .git/config,
            # which holds the token in cleartext, into public/ — the directory Vite
            # copies verbatim into dist/. Even briefly, that window is not worth having.
            git -C .pool-branch archive HEAD | tar -x -C public/data/pool
            # The extract above cannot fail loudly on its own, so assert the result.
            test -f public/data/pool/manifest.json \
              || { echo "Restore produced no manifest.json — refusing to continue"; exit 1; }
            echo "Restored $(ls public/data/pool | wc -l) files from the pool branch"
          elif [ "$rc" -eq 2 ]; then
            echo "No pool branch yet — it will be created from the seed in main."
          else
            echo "git ls-remote failed (exit $rc) — aborting rather than guessing"
            exit 1
          fi
          # blocklist.json is a human-curated SAFETY file and main is authoritative for
          # it. Without this, an ID added on main never reaches the site: the pool branch
          # would round-trip its own frozen copy forever.
          # Not an AND-list: set -e is exempt inside one, so this is safe today only
          # because it is the step's last line. Any line added below would silently
          # reintroduce the failure. Same form as deploy-pages.yml.
          git show HEAD:public/data/pool/blocklist.json > /tmp/blocklist.json \
            || { echo "Could not read blocklist.json from main — refusing to continue"; exit 1; }
          mv /tmp/blocklist.json public/data/pool/blocklist.json
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Harvest
        id: run
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          HARVEST_UNITS: ${{ github.event.inputs.units || '9000' }}
          # Only ever '1' or unset. Documented recovery was "clear baselineYield on the
          # pool branch by hand", which bypasses the relearn guard and can leave the gate
          # disarmed with no warning; this path keeps that guard.
          HARVEST_BASELINE_RESET: ${{ inputs.baseline_reset && '1' || '' }}
        run: node scripts/harvest.mjs

      # Incremental re-validation, sharing the same pool checkout and the same publish
      # step. Nightly rather than weekly because the cursor makes each run a fixed cost:
      # 500 units covers 25,000 records, so a 100k pool is fully re-checked every ~4
      # nights. Non-fatal — a sweep failure must not discard a good harvest.
      - name: Re-validate a slice of the pool
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REVALIDATE_UNITS: '500'
        run: node scripts/revalidate.mjs

      # The sweep refuses to act on a window whose removal rate looks like an API-wide
      # fault rather than real deletions, and it deliberately exits 0 and advances the
      # cursor so one bad window cannot wedge the sweep forever. That makes the refusal
      # invisible unless something reads the flag — this step is that reader.
      # A `::warning::` on an otherwise-green run notifies nobody — you only see it by
      # opening the run. Route this into the same harvester-health issue the hard
      # failures use, because that emails.
      - name: Did the sweep refuse its findings?
        id: sweep
        run: |
          node -e "
            const m = require('./public/data/pool/manifest.json')
            process.stdout.write('refused=' + (m.stats?.lastSweep?.refused === true))
          " >> "$GITHUB_OUTPUT"

      - name: Report a refused sweep
        if: steps.sweep.outputs.refused == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = [
              `Re-validation **refused** this window's findings: it would have removed more`,
              `of the window than the mass-removal guard allows, which is far more likely to`,
              `be a bad API response than reality.`,
              ``,
              `Nothing was tombstoned for that window, and the cursor still advanced — the`,
              `sweep is NOT wedged, and the window is re-examined on the next full pass.`,
              `One of these is routine. Several nights running is not: check whether`,
              `videos.list is returning empty items for valid ids.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n')
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'harvester-health',
            })
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Harvester health: re-validation refused a window',
                body, labels: ['harvester-health'],
              })
            }

      - name: Verify pool invariants before publishing
        run: node scripts/check-pool.mjs

      - name: Publish the pool
        run: |
          set -euo pipefail
          if [ -d .pool-branch/.git ]; then
            # Swap in this run's output but KEEP .git, so the commit extends the
            # existing history and the push is a plain fast-forward.
            find .pool-branch -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            rm -rf .pool-branch && mkdir -p .pool-branch
            git -C .pool-branch init -q -b pool
            git -C .pool-branch remote add origin \
              "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          cp -R public/data/pool/. .pool-branch/
          cd .pool-branch
          git config user.name "harvest-bot"
          git config user.email "harvest-bot@users.noreply.github.com"
          git add -A
          # A quota-capped run can legitimately produce no new videos. Committing
          # nothing is not a failure, so tolerate an empty diff rather than failing
          # the workflow and raising a false alarm.
          if git diff --cached --quiet; then
            echo "No pool changes to publish."
            exit 0
          fi
          NEW=$(node -e "console.log(require('./manifest.json').total)")
          # Append-only means two exact invariants: the total never decreases and no
          # shard is ever deleted. Both are cheap, and together they make it impossible
          # to fast-forward an empty or shrunken pool over a good one.
          if git rev-parse --verify -q HEAD >/dev/null; then
            PREV=$(git show HEAD:manifest.json \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).total))')
            [ "$NEW" -ge "$PREV" ] \
              || { echo "REFUSING TO PUBLISH: pool shrank $PREV -> $NEW"; exit 1; }
            DELETED=$(git diff --cached --diff-filter=D --name-only)
            if grep -q '^shard-' <<<"$DELETED"; then
              echo "REFUSING TO PUBLISH: a shard was deleted; shards are immutable"
              exit 1
            fi
          fi
          git commit -q -m "harvest: pool at ${NEW} videos"
          # No --force: this is a fast-forward onto the branch we just cloned.
          git push -q origin HEAD:pool
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}

      # A red Actions run on an unwatched repo is invisible. An issue sends email.
      - name: Raise the alarm
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Harvester health: run failed'
            const body = [
              `The nightly harvest failed.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Triage: docs/OPERATIONS.md — the usual causes are a broken canary`,
              `(YouTube changed ID tokenization), a frozen sampling frontier`,
              `(no-fresh-progress), an invalid/restricted API key, or a collapsed yield.`,
            ].join('\n')
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'harvester-health',
            })
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['harvester-health'],
              })
            }

  publish:
    needs: harvest
    if: success()
    uses: ./.github/workflows/deploy-pages.yml
