name: deploy-pages (reusable)

# Extracted so BOTH the push-to-main deploy and the nightly harvest can publish.
# The harvester pushes data to the `pool` branch with GITHUB_TOKEN, which by design
# does not trigger other workflows — so it has to call this directly.
on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The live pool lives on the `pool` branch. main carries only a small seed copy,
      # so overlay the branch version whenever it exists.
      # NOTE: the pool committed on `main` is what ships. This step used to overlay the
      # `pool` branch on top, which meant the live site served data that had never been
      # merged — main's copy was decorative. Nightly harvesting still accumulates on
      # `pool`, but nothing reaches viewers until a promotion PR lands on main.

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A workflow_dispatch or harvest-triggered deploy is not gated by branch
      # protection, so re-run the gates here rather than publishing an untested tree.
      - name: Deploy gate
        run: |
          npm test
          npm run lint
          npm run format:check
          node scripts/check-pool.mjs

      # No `enablement: true`: GITHUB_TOKEN cannot create a Pages site ("Resource not
      # accessible by integration"), so it must be enabled once by an admin:
      #   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
      # Documented in docs/OPERATIONS.md.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build (vite)
        run: npm run build
        env:
          VITE_REPORT_EMAIL: ${{ vars.VITE_REPORT_EMAIL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
